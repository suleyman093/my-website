databases:
  - name: mueyyensayt-db
    plan: free
    databaseName: mueyyensayt

services:
  - type: web
    name: mueyyensayt
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: 10000
      - key: PUBLIC_BASE_URL
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: COOKIE_SAME_SITE
        value: Lax
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: mueyyensayt-db
          property: connectionString
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
